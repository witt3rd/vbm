# Runs the repo's own Tier 1 (scripts/tier1.sh) on every push to main, on GitHub-hosted runners only (scripts/check-ci-visibility.py fails Tier 1 if any job names a self-hosted runner in a public repo). The job name `tier1` is what LAND_TIER1_JOB in scripts/land.conf names: the lander's red check reads this job of this workflow.
# Actions are pinned by commit SHA. No secrets, no network beyond checkout and the package installs, read-only token. It does not run on pull requests: a change is a proposal that the owner lands.
name: tier1
on:
  push:
    branches: [main]
    # only guidelines/** (pure prose) skips CI: Tier 1 lints the WHOLE tree (scripts/lint-public) and checks README.md, docs/cards and the registry, so no other path is ignorable
    paths-ignore: ['guidelines/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      # the sandbox tests need bubblewrap (apt) and unprivileged user namespaces (hosted runners restrict them)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: scripts/tier1.sh
        env:
          GH_TOKEN: ${{ github.token }}   # scripts/check-ci-visibility reads the repo's visibility
