# Landing configuration for scripts/land-direct. The lander is a pinned copy of vbm-land (scripts/land/, scripts/land/PIN); this file and scripts/land.d/ are this repository's own.
# Read from origin/main by the lander (a change cannot loosen the rules it is judged by). Every key: scripts/land/lib/conf.sh.
LAND_BASE=main
# Red main: the tier1 job of the latest push run of tier1.yml (an infrastructure failure, or a job that has not started, is not red).
LAND_CI_WORKFLOW=tier1.yml
LAND_TIER1_JOB=tier1
LAND_RED_MODE=push
# Tier 1 on the rebased combination.
LAND_TEST_CMD=mise exec -- scripts/tier1.sh
# Size budget: the runner (a `Diff-Budget: <note>` trailer waives it).
LAND_PROD_PATHS=scorecard
LAND_BUDGET_LINES=150
LAND_CONVENTIONAL=1

# The structural protected set (vbm-land v0.4.x): a landing that touches a path of this list is refused (exit 12) unless a one-time approval for exactly that set and diff is already on main (scripts/gate-edit-approvals.txt).
LAND_PROTECTED_LIST=scripts/protected-paths.txt
