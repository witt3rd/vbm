# gitleaks configuration (the secret gate): the default rules, plus reviewed allowlists, each with its reason. Never allowlist a real secret: rotate it, then remove it (vbm-land docs/secrets-gate.md).
title = "vbm"

[extend]
useDefault = true

[[allowlists]]
description = "vbm-rng's own fields are called `key` (a seed, a stream key) and its known-answer vectors print them: the generic API-key rule reads `.key ...` lines as credentials. Reviewed: the values are public test vectors, not credentials."
targetRules = ["generic-api-key"]
paths = ['^lib/vbm-rng/VbmRngProofs/Stream\.lean$', '^lib/vbm-rng/VbmRngProofs/Vectors\.lean$', '^lib/vbm-rng/docs/spec\.md$']

[[allowlists]]
description = "A refusal-code name, `badIndexKey`, with a quoted string beside it: the generic API-key rule reads it as a credential. Reviewed 2026-11-20: 1 finding, not a secret."
targetRules = ["generic-api-key"]
paths = ['^lib/vbm-decision/VbmDecisionProofs/Decode\.lean$']
