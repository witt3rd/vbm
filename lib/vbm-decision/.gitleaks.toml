# gitleaks configuration (the secret gate): the default rules, plus one reviewed allowlist.
title = "vbm-decision"

[extend]
useDefault = true

[[allowlists]]
description = "A refusal-code name, `badIndexKey`, with a quoted string beside it: the generic API-key rule reads it as a credential. Reviewed 2026-11-20: 1 finding, not a secret."
targetRules = ["generic-api-key"]
paths = ['^VbmDecisionProofs/Decode\.lean$']
