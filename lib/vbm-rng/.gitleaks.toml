# gitleaks configuration (the secret gate): the default rules, plus one reviewed allowlist.
title = "vbm-rng"

[extend]
useDefault = true

[[allowlists]]
description = "The generator's own fields are called `key` (a seed, a stream key) and the known-answer vectors print them: the generic API-key rule reads `.key = <hex>` as a credential. Reviewed 2026-11-20: 3 findings, all test data."
targetRules = ["generic-api-key"]
paths = ['^VbmRngProofs/Stream\.lean$', '^VbmRngProofs/Vectors\.lean$', '^docs/spec\.md$']
